name: Release

# Step 2 of the single-branch release: take the stabilized release/v* or
# hotfix/v* branch, run tests against the carried -pre.0 version, strip
# the suffix into the final version, commit on the source branch, tag
# vX.Y.Z, atomic-push branch + tag, create the GitHub Release, then
# delete the source branch on success.
#
# NuGet publication is handled separately by `publish-nuget.yml`,
# triggered by the tag push. This keeps the NuGet API key scoped to a
# tag-only GitHub environment, and binds the deploy identity to the tag
# ref itself.
#
# Trigger: maintainer dispatches from the Actions UI with a release/v*
# or hotfix/v* branch selected. Branch name is the source of truth for
# the version that will become the tag; .csproj version stem must match.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: run tests, strip prerelease suffix, commit + build locally; skip atomic push, GitHub Release, and branch deletion."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse if not dispatched from a release/v* or hotfix/v* branch
        run: |
          ref="${{ github.ref_name }}"
          if [[ ! "$ref" =~ ^(release|hotfix)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must be dispatched from a release/v<X.Y.Z> or hotfix/v<X.Y.Z> branch (got: $ref)"
            exit 1
          fi
          echo "Dispatched from $ref"

      # Fail fast if the AuthPlane Release Bot App secrets aren't available
      # (e.g. a fork or unconfigured clone). The token-mint step would
      # otherwise fail with a generic actions/create-github-app-token error.
      - name: Refuse if Release Bot secrets are missing
        env:
          APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Release Bot App secrets (RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY) are unavailable in this run. They live as AuthPlane org secrets scoped to the OSS release repo; forks or unconfigured clones must follow the manual procedure in RELEASE_SETUP.md."
            exit 1
          fi

      # Tag/branch rulesets reject GHA bot pushes for v* tags. Mint a
      # short-lived installation token for the AuthPlane Release Bot
      # App (bypass actor on the ruleset) and pass it to checkout so the
      # atomic push and source-branch delete use the App's identity.
      - name: Mint release-bot token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check out repo with full history and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ steps.app_token.outputs.token }}

      # AuthPlane/conformance carries the shared oauth-sdk-conformance-catalog.yaml.
      # Checked out into $RUNNER_TEMP — outside $GITHUB_WORKSPACE — so the
      # catalog never pollutes the working tree of the commit we tag.
      - name: Check out shared conformance catalog (outside workspace)
        # Pinned by SHA (was: clone of the latest default branch), from the same
        # tracked `.conformance-catalog-ref` that ci.yml reads. A release must
        # verify against the catalog the PRs were verified against, or a case
        # added between merge and tag could fail the release run.
        shell: bash
        run: |
          CONFORMANCE_CATALOG_REF="$(cat "$GITHUB_WORKSPACE/.conformance-catalog-ref")"
          # Guard the pin before fetching: a non-SHA value would silently
          # un-pin the release to whatever ref resolves at fetch time.
          grep -Eq '^[0-9a-f]{40}$' <<<"$CONFORMANCE_CATALOG_REF" \
            || { echo "::error::.conformance-catalog-ref must be a 40-hex commit SHA"; exit 1; }
          git init -q "$RUNNER_TEMP/conformance"
          git -C "$RUNNER_TEMP/conformance" \
            fetch --depth=1 https://github.com/AuthPlane/conformance.git "$CONFORMANCE_CATALOG_REF" \
            || { echo "::error::Pinned conformance catalog ref $CONFORMANCE_CATALOG_REF is unreachable"; exit 1; }
          git -C "$RUNNER_TEMP/conformance" checkout -q FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Read version from csproj and validate against branch name
        # Release branch carries `<release>-pre.0` from the cut. Strip the
        # suffix to derive the final release version, then validate it
        # matches the branch name (release/v<release> or hotfix/v<release>).
        # Hotfix branches were cut from a tag without a version edit; the
        # branch name is the source of truth in that case.
        id: version
        run: |
          # First csproj is the source of truth — both csprojs must agree
          # (verified below).
          csproj_version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Authplane/Authplane.csproj | head -1)
          mcp_version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Authplane.Mcp/Authplane.Mcp.csproj | head -1)
          if [[ "$csproj_version" != "$mcp_version" ]]; then
            echo "::error::Version mismatch: Authplane.csproj=$csproj_version, Authplane.Mcp.csproj=$mcp_version"
            exit 1
          fi
          branch_version="${GITHUB_REF_NAME##*/v}"
          if [[ "$GITHUB_REF_NAME" == release/* ]]; then
            # Current-line release: csproj must carry -pre.N suffix.
            if ! [[ "$csproj_version" =~ -pre\.[0-9]+$ ]]; then
              echo "::error::Release branch csproj version must end with -pre.N (got: $csproj_version)"
              exit 1
            fi
            version="${csproj_version%-pre.*}"
            if [[ "$version" != "$branch_version" ]]; then
              echo "::error::Branch name version ($branch_version) does not match csproj version stem ($version, from $csproj_version)"
              exit 1
            fi
          else
            # Hotfix: csproj carries the previous release's plain version
            # (no edit at cut time). Trust the branch name.
            version="$branch_version"
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Aborting."
            exit 1
          fi

      # hotfix/v* is reserved for patches to an older minor line. Refuse
      # dispatch if the branch's (major, minor) is not strictly less than
      # the default branch's latest released (major, minor). Current-line
      # patches should use release/v*, not hotfix/v*.
      - name: Refuse if hotfix branch is not strictly an older-line patch
        if: startsWith(github.ref_name, 'hotfix/')
        run: |
          default="${{ github.event.repository.default_branch }}"
          git fetch origin "$default" --tags --no-recurse-submodules
          if ! main_tag=$(git describe --tags --abbrev=0 "origin/$default" 2>/dev/null); then
            echo "::error::Cannot determine $default's latest tag — has a release ever shipped? If not, use release/v* for the first release."
            exit 1
          fi
          echo "$default's latest tag: $main_tag"

          if ! [[ "$main_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$default's latest tag '$main_tag' does not match vX.Y.Z."
            exit 1
          fi
          main_major="${BASH_REMATCH[1]}"
          main_minor="${BASH_REMATCH[2]}"

          v="${{ steps.version.outputs.version }}"
          [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          br_major="${BASH_REMATCH[1]}"
          br_minor="${BASH_REMATCH[2]}"

          if (( br_major > main_major )) || { (( br_major == main_major )) && (( br_minor >= main_minor )); }; then
            echo "::error::hotfix/v${v} is on line v${br_major}.${br_minor}, which is not strictly older than $default's line v${main_major}.${main_minor}."
            echo "::error::Current-line patches must use release/v*, not hotfix/v*."
            exit 1
          fi
          echo "Confirmed older-line patch: v${br_major}.${br_minor} < v${main_major}.${main_minor}"

      - name: Verify CHANGELOG entry exists for this version
        # grep -F (fixed-string) so the `.` characters in the version don't
        # get interpreted as regex any-char wildcards (e.g. version "1.3.0"
        # would otherwise also match "## [1a3b0]" in the changelog). The
        # version is validated to [0-9]+\.[0-9]+\.[0-9]+ upstream so this is
        # not exploitable, but the precise check is the correct one.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md 2>/dev/null; then
            echo "::error::CHANGELOG.md has no entry for ## [$VERSION]"
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore + build solution
        run: |
          dotnet restore Authplane.slnx
          dotnet build Authplane.slnx --configuration Release --no-restore

      - name: Test against branch version
        # release/* branches carry `X.Y.Z-pre.N` at this point; hotfix/* branches
        # carry the previous release's plain version (no edit at cut time). In
        # both modes this exercises the code as stabilized, before the version
        # bump that follows.
        env:
          CONFORMANCE_CATALOG_PATH: ${{ runner.temp }}/conformance/oauth-sdk-conformance-catalog.yaml
        run: dotnet test Authplane.slnx --configuration Release --no-build

      # Strip pre-release suffix to the final version. Only the first
      # <Version> per file (the PropertyGroup entry) is replaced.
      - name: Strip prerelease suffix to final release version
        if: startsWith(github.ref_name, 'release/')
        run: |
          new_version="${{ steps.version.outputs.version }}"
          for csproj in src/Authplane/Authplane.csproj src/Authplane.Mcp/Authplane.Mcp.csproj; do
            sed -i "0,/<Version>[^<]*<\/Version>/ s||<Version>${new_version}</Version>|" "$csproj"
          done

      # Hotfix mode: write the final version directly (cut-release.yml did
      # not edit versions for hotfix branches).
      - name: Set hotfix release version
        if: startsWith(github.ref_name, 'hotfix/')
        run: |
          new_version="${{ steps.version.outputs.version }}"
          for csproj in src/Authplane/Authplane.csproj src/Authplane.Mcp/Authplane.Mcp.csproj; do
            sed -i "0,/<Version>[^<]*<\/Version>/ s||<Version>${new_version}</Version>|" "$csproj"
          done

      - name: Rebuild after version edit
        # The earlier `dotnet build` step compiled assemblies against the
        # carried `-pre.0` (release/*) or pre-bump (hotfix/*) version. After
        # the strip/set-version steps above, the csproj <Version> is the
        # final X.Y.Z. Re-running the build is what brings the assembly's
        # AssemblyInformationalVersion in line with the nuspec the next
        # step will emit — without this, the pre-flight `.nupkg` would
        # advertise X.Y.Z in its nuspec while embedding an assembly stamped
        # X.Y.Z-pre.0, which is also the divergence publish-nuget.yml does
        # not have (it builds + packs both against the tagged commit's
        # already-stripped csprojs).
        run: dotnet build Authplane.slnx --configuration Release --no-restore

      - name: Pack (pre-flight)
        # Local pack against the final X.Y.Z (post-strip / post-hotfix-set,
        # post-rebuild) so the pre-flight exercises both the .nuspec and the
        # embedded assembly shape that publish-nuget.yml will produce.
        # Running before the strip would pack `-pre.0` and miss version-
        # specific packaging regressions (e.g. SourceLink fields that only
        # matter on the public version). Output is discarded; the real pack
        # happens in publish-nuget.yml.
        run: |
          dotnet pack Authplane.slnx \
            --configuration Release \
            --no-build \
            --output "${{ runner.temp }}/preflight-nupkg"

      - name: Commit release version on the source branch
        # --allow-empty defends the hotfix-rerun case: cut-release.yml does
        # not edit versions on hotfix branches, so the "Set hotfix release
        # version" step above writes the version directly. If the branch was
        # already bumped to the final version by a prior failed dispatch,
        # sed is a no-op and `git commit` would otherwise abort with
        # "nothing to commit". The release/* rerun path is already blocked
        # upstream by the -pre.N precondition on the version step, so the
        # --allow-empty defense is hotfix-only in practice. The empty commit
        # still ties the tag to the release-job summary on the rerun.
        run: |
          git add -A
          git commit --allow-empty -m "release: ${{ steps.version.outputs.version }}"

      - name: Capture release commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag locally
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"

      - name: Dry run short-circuit notice
        if: ${{ inputs.dryRun }}
        run: |
          echo "::notice::Dry run — skipping atomic push of branch + tag, GitHub Release, and branch deletion. publish-nuget.yml would be triggered by the tag push on a real run. Release commit SHA (would-be): ${{ steps.sha.outputs.sha }}"

      # ---------- From here on, changes are written to the remote. ----------

      - name: Atomic push of source branch and tag
        if: ${{ !inputs.dryRun }}
        run: |
          git push --atomic origin "$GITHUB_REF_NAME" "${{ steps.version.outputs.tag }}"
          echo "::notice::Released commit: ${{ steps.sha.outputs.sha }}"

      - name: Extract CHANGELOG entry for release notes
        if: ${{ !inputs.dryRun }}
        run: |
          version="${{ steps.version.outputs.version }}"
          sha="${{ steps.sha.outputs.sha }}"
          {
            echo "_Released commit: \`$sha\`_"
            echo ""
            awk "/^## \[$version\]/{flag=1;next} /^## \[/{flag=0} flag" CHANGELOG.md
          } > /tmp/release-notes.md
          if [[ $(wc -l < /tmp/release-notes.md) -le 2 ]]; then
            echo "See CHANGELOG.md for details." >> /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md

      - name: Delete source branch on remote
        if: ${{ !inputs.dryRun }}
        continue-on-error: true
        id: delete
        run: git push origin --delete "$GITHUB_REF_NAME"

      - name: Warn if delete failed
        if: ${{ !inputs.dryRun && steps.delete.outcome == 'failure' }}
        run: |
          echo "::warning::Source branch delete failed. Run manually: git push origin --delete $GITHUB_REF_NAME"

      - name: Summary
        if: always()
        run: |
          v="${{ steps.version.outputs.version }}"
          sha="${{ steps.sha.outputs.sha }}"
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            {
              echo "### Dry run complete"
              echo ""
              echo "- **Version**: \`$v\` (not published)"
              echo "- **Would-be released commit**: \`$sha\`"
              echo "- Tests, version strip, commit, tag — all succeeded."
              echo "- Atomic push, GitHub Release, branch delete, and NuGet publish (via publish-nuget.yml) were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Release tag pushed"
              echo ""
              echo "- **Version**: \`$v\`"
              echo "- **Released commit**: \`$sha\`"
              echo "- **Tag**: \`v$v\` (pushed — triggers \`publish-nuget.yml\`)"
              echo "- **GitHub Release**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v"
              echo "- **NuGet (pending)**: watch \`publish-nuget.yml\` run — it pushes the packages from the tag ref."
              if [[ "${{ steps.delete.outcome }}" != "success" ]]; then
                echo ""
                echo "⚠️ **Branch delete failed — run manually:** \`git push origin --delete $GITHUB_REF_NAME\`"
              fi
              echo ""
              echo "**Follow-up:**"
              echo "- If any commits on this branch should reach the default branch, backport them manually from \`v$v\` (the tag, not the branch — the branch is deleted) until a backport workflow lands."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
