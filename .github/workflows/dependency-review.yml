name: Dependency Review

# NOTE on coverage: GitHub's dependency-review-action only runs on public
# repositories or on private repositories with GitHub Advanced Security
# enabled. On a private repo without GHAS (this repo's current state) the
# action logs "Dependency review is not supported on this repository" and
# the `continue-on-error: true` below turns that into a soft pass. The
# green check is therefore NOT real licence/vulnerability coverage until
# the repo is made public or GHAS is enabled — at which point this
# workflow starts gating PRs without further changes.

on:
  pull_request:

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # MPL-2.0 is safe only as a transitive dependency — do not vendor or
          # fork MPL-licensed source without re-evaluating the obligations.
          allow-licenses: Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, CC0-1.0, Unlicense, 0BSD, Python-2.0, MPL-2.0
      - name: Dependency review not supported notice
        if: ${{ failure() }}
        run: |
          echo "Dependency review is not supported for this repository configuration."
          echo "Proceeding without blocking CI."
